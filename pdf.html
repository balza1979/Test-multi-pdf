<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>PDF della Cartella</title>

<style>
body {
  font-family: Arial;
  background: #eef1f5;
  padding: 40px;
}
h1 {
  text-align: center;
}
.back-button {
    position: fixed;
    top: 15px;
    right: 15px;
    background-color: #0275d8;
    color: white;
    padding: 20px 28px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    transition: background-color 0.2s ease;
    z-index: 999;
    font-size: 26px;
}
.back-button:hover {
    background-color: #025aa5;
}
.card {
  background: white;
  padding: 20px;
  margin: 15px auto;
  max-width: 850px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card span {
  font-size: 40px;
  font-weight: 700;
}
.card button {
  background: #007bff;
  color: white;
  border: none;
  padding: 20px 40px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 28px;
  font-weight: 700;
}
.card button:hover {
  background: #0056b3;
}
</style>
</head>

<body>

<a class="back-button" href="index.html">⬅ Torna Indietro</a>

<h1 id="titolo"></h1>
<div id="pdf-container"></div>

<script>
const params = new URLSearchParams(window.location.search);
const cartella = params.get("cartella");

document.getElementById("titolo").textContent = "PDF in: " + cartella;

fetch("elenco.json")
  .then(r => r.json())
  .then(data => {
    const pdfs = data[cartella];
    const container = document.getElementById("pdf-container");

    pdfs.forEach(pdf => {
      const encodedName = encodeURIComponent(pdf);
      const encodedFolder = encodeURIComponent(cartella);

      // URL diretto al PDF
      const directUrl = `https://balza1979.github.io/Test-multi-pdf/pdf/${encodedFolder}/${encodedName}`;

      // URL Google Docs Viewer (fallback)
      const gviewUrl =
        `https://docs.google.com/gview?embedded=1&url=` +
        directUrl;

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <span>📄 ${pdf}</span>
        <button onclick="openPdf('${directUrl}', '${gviewUrl}')">Apri</button>
      `;

      container.appendChild(card);
    });
  });


// 🔥 Funzione che prova l'apertura diretta, e se fallisce usa Google Docs Viewer
function openPdf(directUrl, gviewUrl) {
  const win = window.open(directUrl, "_blank");

  // Se il browser blocca l'apertura diretta → win sarà null
  if (!win) {
    window.open(gviewUrl, "_blank");
    return;
  }

  // Controllo aggiuntivo: se il PDF non si carica entro 1.5 secondi → fallback
  setTimeout(() => {
    try {
      if (win.location.href === "about:blank") {
        win.location.href = gviewUrl;
      }
    } catch (e) {
      // Se il browser blocca l'accesso → fallback
      win.location.href = gviewUrl;
    }
  }, 1500);
}
</script>

</body>
</html>
