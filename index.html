<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Seleziona una Cartella</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f5f5f5;
    }

    /* Bottone Home */
    .home-button {
        position: fixed;
        top: 15px;
        right: 15px;
        background-color: #d9534f;
        color: white;
        padding: 40px 55px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        transition: background-color 0.2s ease;
        z-index: 999;
        font-size: 55px;
    }

    .home-button:hover {
        background-color: #c9302c;
    }

    /* Titolo */
    h1 {
        text-align: center;
        margin-top: 120px;
        font-size: 36px;
        color: #333;
    }

    /* Contenitore delle card */
    #folder-container {
        max-width: 900px;
        margin: 40px auto;
        padding: 10px;
         font-size: 55px;
    }

    /* Card */
    .card {
        background: white;
        padding: 20px;
        margin: 15px auto;
        max-width: 850px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .card span {
        font-size: 45px;
        font-weight: 700;
    }

    /* Pulsante Apri */
    .card button {
        background: #28a745;
        color: white;
        border: none;
        padding: 20px 40px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 22px;
        font-weight: 700;
        transition: background 0.2s ease;
    }

    .card button:hover {
        background: #1e7e34;
    }
</style>

</head>
<body>

<a class="home-button" href="https://balza1979.github.io/Elmi-Documenti/">Home</a>

<h1>Seleziona una Cartella</h1>

<div id="folder-container"></div>

<script>
const owner = "balza1979";
const repo = "Test-multi-pdf";
const folder = "pdf";

const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;

fetch(apiUrl)
    .then(response => response.json())
    .then(items => {
        const folders = items.filter(i => i.type === "dir");
        const container = document.getElementById("folder-container");

        folders.forEach(dir => {
            const encoded = encodeURIComponent(dir.name);

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <span>📁 ${dir.name}</span>
                <button onclick="location.href='lista.html?cartella=${encoded}'">Apri</button>
            `;

            container.appendChild(card);
        });
    })
    .catch(err => console.error("Errore nel caricamento delle cartelle:", err));
</script>

</body>
</html>
