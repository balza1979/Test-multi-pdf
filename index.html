<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Seleziona Cartella</title>

<style>
body {
  font-family: Arial;
  background: #eef1f5;
  padding: 40px;
}
h1 {
  text-align: center;
}
.card {
  background: white;
  padding: 20px;
  margin: 15px auto;
  max-width: 850px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card span {
  font-size: 40px;
  font-weight: 700;
}
.card button {
  background: #28a745;
  color: white;
  border: none;
  padding: 20px 40px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 28px;
  font-weight: 700;
}
.card button:hover {
  background: #1e7e34;
}
</style>
</head>

<body>

<h1>Seleziona una Cartella</h1>
<div id="folder-container"></div>

<script>
const owner = "balza1979";
const repo = "Test-multi-pdf";   // <— QUI È L’UNICA COSA IMPORTANTE
const folder = "pdf";

const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;

fetch(apiUrl)
  .then(response => response.json())
  .then(items => {
    const folders = items.filter(i => i.type === "dir");
    const container = document.getElementById("folder-container");

    folders.forEach(dir => {
      const encoded = encodeURIComponent(dir.name);

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <span>📁 ${dir.name}</span>
        <button onclick="location.href='lista.html?cartella=${encoded}'">Apri</button>
      `;

      container.appendChild(card);
    });
  })
  .catch(err => console.error("Errore nel caricamento delle cartelle:", err));
</script>

</body>
</html>
