<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Seleziona Cartella</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

/* Bottone Home */
.home-button {
    position: fixed;
    top: 15px;
    right: 15px;
    background-color: #d9534f;
    color: white;
    padding: 30px 65px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    font-size: 40px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    transition: background-color 0.2s ease;
    z-index: 999;
}

.home-button:hover {
    background-color: #c9302c;
}

/* Titolo più in basso */
h1 {
    text-align: center;
    margin-top: 120px;
}

/* Contenitore pulsanti PDF */
#pdf-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
    margin-top: 40px;
}

/* Stile pulsanti PDF */
.pdf-button {
    background-color: #007bff;
    color: white;
    padding: 12px 40px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 45px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: background-color 0.2s ease;
    width: 260px; /* puoi cambiare la misura */
    display: block;
  
}

.pdf-button:hover {
    background-color: #0056b3;
}

}
.card {
  background: white;
  padding: 20px;
  margin: 15px auto;
  max-width: 850px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card span {
  font-size: 40px;
  font-weight: 900;
}
.card button {
  background: #28a745;
  color: white;
  border: none;
  padding: 25px 45px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 28px;
  font-weight: 700;
}
.card button:hover {
  background: #1e7e34;
}
</style>
</head>

<body>
<a class="home-button" href="https://balza1979.github.io/Elmi-Documenti/">Home</a>
#pdf-container {
    margin-top: 80px;
}

<h1>Seleziona una Cartella</h1>
<div id="folder-container"></div>

<script>
const owner = "balza1979";
const repo = "Test-multi-pdf";   // <— QUI È L’UNICA COSA IMPORTANTE
const folder = "pdf";

const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;

fetch(apiUrl)
  .then(response => response.json())
  .then(items => {
    const folders = items.filter(i => i.type === "dir");
    const container = document.getElementById("folder-container");

    folders.forEach(dir => {
      const encoded = encodeURIComponent(dir.name);

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <span>📁 ${dir.name}</span>
        <button onclick="location.href='lista.html?cartella=${encoded}'">Apri</button>
      `;

      container.appendChild(card);
    });
  })
  .catch(err => console.error("Errore nel caricamento delle cartelle:", err));
</script>

</body>
</html>
