<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Caricamento…</title>
<style>
body {
  background: #f2f2f2;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: Arial;
  color: #333;
  flex-direction: column;
}

.loader {
  border: 10px solid #ddd;
  border-top: 10px solid #007bff;
  border-radius: 50%;
  width: 80px;
  height: 80px;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

h2 {
  font-size: 28px;
  margin: 0;
}
</style>
</head>
<body>

<div class="loader"></div>
<h2>Caricamento del documento…</h2>

</body>
</html>
